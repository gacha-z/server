name: Deploy Dev API

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Server-Secret 은 private 서브모듈이라 기본 GITHUB_TOKEN 으로는 못 받아온다.
      # SERVER_SECRET_TOKEN(PAT)이 이 레포(gacha-z/server)와 gacha-z/server-secret 둘 다에
      # 읽기 권한이 있어야 한다.
      - name: Checkout source code (with Server-Secret submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SERVER_SECRET_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      # bootJar 이전에 processResources -> copyPrivate 가 Server-Secret 의 yml/p8/json 을
      # src/main/resources 로 복사하므로, 이미지에는 이미 실제 설정값이 들어간 채로 빌드된다.
      - name: Build Spring Boot JAR
        run: ./gradlew clean bootJar -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: hansangmin/gatchaz-server:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Pull new image and restart via docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          port: ${{ secrets.DEV_EC2_PORT }}
          script: |
            set -e
            cd /home/ubuntu/gatchaz

            # spring 이미지만 새로 받는다 (nginx는 거의 안 바뀌니 매번 pull할 필요 없음)
            docker compose pull spring
            docker compose up -d
            docker image prune -f

            echo "Deploy finished"
            docker compose ps
