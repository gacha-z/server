name: Deploy Dev Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: gacha-z/server
          ref: develop

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build WAR
        run: ./gradlew clean war -x test

      - name: Build Docker image
        run: |
          IMAGE_NAME="api_$(date +%Y%m%d%H%M%S)"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

          docker build -t "$IMAGE_NAME" .
          docker save "$IMAGE_NAME" -o "$IMAGE_NAME.tar"

      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          port: ${{ secrets.DEV_EC2_PORT }}
          source: "${{ env.IMAGE_NAME }}.tar"
          target: "/home/ubuntu/deploy"

      - name: Run Docker container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          port: ${{ secrets.DEV_EC2_PORT }}
          script: |
            set -e

            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            CONTAINER_NAME="gacha-z-server-dev"
            HOST_PORT="8081"
            CONTAINER_PORT="8080"
            DEPLOY_DIR="/home/ubuntu/deploy"

            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            docker load -i "$IMAGE_NAME.tar"

            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file /home/ubuntu/gacha-z/.env \
              -p "$HOST_PORT:$CONTAINER_PORT" \
              "$IMAGE_NAME"

            rm -f "$IMAGE_NAME.tar"

            docker image prune -f
